apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// GitHub Actions がビルド時だけ Secrets から復元する固定の署名鍵(リポジトリには入れない)
def stableKeystore = file("typingpet.jks")
def hasStableKey = stableKeystore.exists() &&
        System.getenv("KEYSTORE_PASSWORD") &&
        System.getenv("KEY_ALIAS") &&
        System.getenv("KEY_PASSWORD")

android {
    namespace 'com.typingpet.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.typingpet.app"
        minSdk 24
        targetSdk 34
        versionCode 13
        versionName "1.8.1-zh"
    }

    signingConfigs {
        stable {
            if (hasStableKey) {
                storeFile stableKeystore
                storeType "PKCS12"
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (hasStableKey) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
            // 固定鍵があるときは必ずそれで署名する(debug 鍵にフォールバックさせない)
            if (hasStableKey) {
                signingConfig signingConfigs.stable
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions { jvmTarget = '1.8' }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
    implementation "androidx.core:core:1.13.1"
}