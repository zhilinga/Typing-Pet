name: Build APK

on:
  push:
  workflow_dispatch:

# Release 发布需要写权限，GITHUB_TOKEN 默认只有读
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.4"

      # 固定の署名鍵を Secrets から復元(毎回同じ鍵で署名 → 上書き更新できる)
      # 登録されていない場合はスキップし、Android 標準の debug 鍵で署名してビルドを続行する
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Secret KEYSTORE_BASE64 が未登録のため、debug 鍵で署名します(上書き更新はできません)"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/typingpet.jks

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug

      - name: Remove signing key
        if: always()
        run: rm -f app/typingpet.jks

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/TypingPet-zh-v${GITHUB_RUN_NUMBER}.apk"
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: typing-pet-debug-apk
          path: out/*.apk

      # 手动触发时同时发布到 Release，手机上可直接点链接下载
      - name: Publish to Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/*.apk \
            --title "中文版 build ${GITHUB_RUN_NUMBER}" \
            --notes "自动构建：汉化 + 空格/回车/粘贴检测" \
            --repo "$GITHUB_REPOSITORY"